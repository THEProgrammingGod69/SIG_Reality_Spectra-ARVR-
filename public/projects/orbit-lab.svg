<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Orbit Lab</title>
  <desc id="desc">Abstract violet orbit rings surrounding a luminous sphere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090812"/><stop offset="1" stop-color="#24123a"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#f2f2f3"/><stop offset=".2" stop-color="#a663fc"/><stop offset="1" stop-color="#a663fc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g fill="none" stroke="#a663fc" stroke-opacity=".6" stroke-width="4" transform="translate(400 500)">
    <ellipse rx="310" ry="120" transform="rotate(-24)"/><ellipse rx="310" ry="120" transform="rotate(34)"/><ellipse rx="310" ry="120" transform="rotate(88)"/>
  </g>
  <circle cx="400" cy="500" r="235" fill="url(#orb)"/>
  <circle cx="400" cy="500" r="72" fill="#f2f2f3" fill-opacity=".85"/>
  <path d="M80 850h640" stroke="#a663fc" stroke-opacity=".35" stroke-width="2"/>
</svg>
