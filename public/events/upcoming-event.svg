<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Upcoming Reality Spectra event placeholder</title>
  <desc id="desc">An abstract violet and cyan field with orbital lines and a central glow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07060c"/><stop offset=".55" stop-color="#26184a"/><stop offset="1" stop-color="#0b334d"/></linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#f2f2f3" stop-opacity=".9"/><stop offset=".2" stop-color="#7cd5ff" stop-opacity=".75"/><stop offset="1" stop-color="#a663fc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1120" cy="440" r="330" fill="url(#orb)" opacity=".55"/>
  <g fill="none" stroke="#7cd5ff" stroke-opacity=".5" stroke-width="3"><ellipse cx="800" cy="500" rx="590" ry="180" transform="rotate(-18 800 500)"/><ellipse cx="800" cy="500" rx="500" ry="110" transform="rotate(27 800 500)"/><ellipse cx="800" cy="500" rx="320" ry="70" transform="rotate(-42 800 500)"/></g>
  <circle cx="800" cy="500" r="68" fill="#a663fc" opacity=".72"/><circle cx="800" cy="500" r="20" fill="#f2f2f3" opacity=".9"/>
</svg>
